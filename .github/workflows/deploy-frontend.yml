name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "angular.json"
      - "package-lock.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production frontend
        run: npm run build -- --configuration production

      - name: Prepare deploy folder
        run: |
          mkdir -p public_html
          cp -r dist/angular-rlav/browser/. public_html/

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 147.93.37.156
          username: ${{ secrets.FTP_RLAV_USERNAME }}
          password: ${{ secrets.FTP_RLAV_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ./domains/rlav.com.br/public_html/
          local-dir: /rlav.com.br/public_html/
